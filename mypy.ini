[mypy]
# Ignore missing stubs warnings for third-party packages
ignore_missing_imports = True

# Allow implicit optional (e.g. service: WatchlistService = None)
no_implicit_optional = False

# Loosen strictness for untyped functions
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Turn off strict untyped checker rules
check_untyped_defs = False

# Ignore GUI type checking noise since PySide6 utilizes dynamic runtime aliases
[mypy-ui_qt.*]
ignore_errors = True

# Historical manual QA/research scripts still target earlier DTO/service shapes.
# Keep the main app/scripts gate actionable without rewriting those validators here.
[mypy-scripts.calculate_technical_indicators]
ignore_errors = True

[mypy-calculate_technical_indicators]
ignore_errors = True

[mypy-scripts.decision_validation_research]
ignore_errors = True

